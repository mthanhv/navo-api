name: CI/CD

# Pull requests: checks only. main: checks → build an arm64 image to ECR →
# deploy to production after approval in the "production" GitHub Environment.
# The server pulls the image, backs up the database, migrates and restarts the
# api through SSM Run Command (no SSH). See navo-infra/README.md for the settings.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: navo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/navo_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./... && go vet -tags=integration ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests (real PostgreSQL)
        run: go test -tags=integration -race -count=1 ./...

  # The browser and API journeys against this commit and the matching branch (else main)
  # of the other repository. The image is built only when this pair works together.
  # Needs: secret SUT_READ_TOKEN (read access to the navo repositories) and navo-at's
  # Actions setting "Accessible from repositories owned by the user".
  journeys:
    uses: mthanhv/navo-at/.github/workflows/e2e.yml@main
    with:
      api_ref: ${{ github.sha }}
    secrets: inherit

  build:
    needs: [check, journeys]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          OPS_BUCKET: ${{ vars.OPS_BUCKET }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          cmd_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "navo-api ${GITHUB_SHA::7}" --timeout-seconds 900 \
            --parameters "commands=[\"aws s3 cp s3://$OPS_BUCKET/deploy/deploy.sh /opt/navo/deploy.sh --quiet\",\"bash /opt/navo/deploy.sh api $IMAGE\"]" \
            --query Command.CommandId --output text)
          echo "SSM command $cmd_id"
          for _ in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query '[StandardOutputContent,StandardErrorContent]' --output text
          test "$status" = Success
